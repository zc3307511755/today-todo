<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fb">
<title>今日待办 · GitHub Pages 静态版</title>
<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --ink:#1b1d29; --muted:#8a8fa3;
    --line:#eceef5; --primary:#5b5cf6; --ok:#12a67a; --danger:#e2545b;
    --shadow:0 18px 45px rgba(43,46,86,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 420px at 12% -8%, #e8e7ff 0%, rgba(232,231,255,0) 62%),
      radial-gradient(700px 380px at 100% 0%, #dff5ee 0%, rgba(223,245,238,0) 58%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  button,input{font-family:inherit}
  button{cursor:pointer;border:none;background:none;color:inherit}
  .shell{max-width:520px;margin:0 auto;padding:24px 18px calc(38px + env(safe-area-inset-bottom));min-height:100vh}
  .hidden{display:none !important}

  .notice{display:flex;gap:10px;align-items:flex-start;background:#fff8e8;border:1px solid #f6e3b8;border-radius:14px;padding:11px 13px;margin-bottom:18px;font-size:12px;line-height:1.6;color:#8a6a24}
  .notice svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
  .notice a{color:#7a5a12;font-weight:700;text-decoration:underline;text-underline-offset:2px}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--primary);margin-bottom:7px}
  h1.title{font-size:29px;margin:0;letter-spacing:-.8px;line-height:1.15}
  .date{margin-top:7px;font-size:13px;color:var(--muted)}
  .badge{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:11.5px;font-weight:700;color:#6b7083;box-shadow:0 6px 16px rgba(43,46,86,.05);white-space:nowrap}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

  .summary{background:linear-gradient(135deg,#5b5cf6 0%,#6c6bf8 55%,#8179fb 100%);border-radius:24px;padding:22px 22px 20px;color:#fff;box-shadow:0 18px 34px rgba(91,92,246,.24);margin-bottom:18px;position:relative;overflow:hidden}
  .summary:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08);right:-70px;top:-95px}
  .summary-top{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1}
  .summary-label{font-size:12.5px;opacity:.85;margin-bottom:6px}
  .summary-num{font-size:44px;font-weight:800;line-height:1;letter-spacing:-2px}
  .summary-num small{font-size:14px;font-weight:600;margin-left:7px;letter-spacing:0;opacity:.9}
  .ring{position:relative;width:62px;height:62px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring-txt{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.26);margin-top:18px;overflow:hidden;position:relative;z-index:1}
  .bar > i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .35s ease}
  .summary-foot{display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;margin-top:9px;position:relative;z-index:1}

  .composer{display:flex;gap:10px;margin-bottom:16px}
  .input{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:0 15px;font-size:16px;color:var(--ink);outline:none;box-shadow:0 6px 18px rgba(43,46,86,.045);transition:border-color .18s,box-shadow .18s}
  .input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(91,92,246,.11)}
  .input::placeholder{color:#b9bdcc}
  .composer .input{flex:1}
  .add{width:56px;height:54px;flex:0 0 auto;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(91,92,246,.28)}
  .add svg{width:22px;height:22px}
  .add:active{transform:translateY(1px)}
  .hint{font-size:12px;color:var(--danger);margin:-8px 0 12px;padding-left:4px}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shake{animation:shake .26s ease}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
  .tabs{display:flex;gap:4px;background:#eceef6;border-radius:11px;padding:3px}
  .tab{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:#8a8fa3}
  .tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(43,46,86,.09)}
  .sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .dot.bad{background:var(--danger)}

  .list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-height:120px}
  .item{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);animation:fade .22s ease}
  .item:last-child{border-bottom:none}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .check{width:25px;height:25px;flex:0 0 auto;border-radius:9px;border:2px solid #d5d8e5;display:grid;place-items:center;background:#fff;transition:.18s}
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:.18s}
  .check.on{background:var(--ok);border-color:var(--ok)}
  .check.on svg{opacity:1;transform:scale(1)}
  .txt{flex:1;font-size:15px;line-height:1.45;word-break:break-word;min-width:0}
  .item.done .txt{color:#aeb2c1;text-decoration:line-through;text-decoration-color:#c9ccd9}
  .del{width:36px;height:36px;flex:0 0 auto;border-radius:10px;color:#c3c7d4;display:grid;place-items:center}
  .del:active{background:#fff2f2;color:var(--danger)}
  .del svg{width:17px;height:17px}
  .empty{padding:44px 20px;text-align:center;color:var(--muted)}
  .empty-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:#f0f0ff;display:grid;place-items:center}
  .empty-ico svg{width:28px;height:28px;color:var(--primary)}
  .empty b{display:block;color:#6b7083;font-size:14px;margin-bottom:5px}
  .empty span{font-size:12px;line-height:1.6}
  .foot{text-align:center;font-size:11px;color:#aeb2c1;margin-top:22px;line-height:1.8}
  .foot a{color:#8a8fa3;text-underline-offset:2px}

  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,18px);background:#242637;color:#fff;font-size:13px;padding:11px 18px;border-radius:999px;box-shadow:0 12px 30px rgba(20,22,40,.28);opacity:0;pointer-events:none;transition:.24s;z-index:50;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="shell">
  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
    <div><b>GitHub Pages 静态演示版</b>：数据只保存在当前浏览器，不登录、不跨设备同步。带账号登录与云端同步的正式版在 <a href="https://today-todo-24403.app.workbuddy.host/?sharecode=EJ2JVSND5V" target="_blank" rel="noopener">这里</a>。</div>
  </div>

  <header class="top">
    <div>
      <div class="eyebrow">TODAY · 今日清单</div>
      <h1 class="title">今日待办</h1>
      <div class="date" id="dateText">—</div>
    </div>
    <div class="badge"><i></i>静态演示版</div>
  </header>

  <section class="summary">
    <div class="summary-top">
      <div>
        <div class="summary-label">还剩这些事要做</div>
        <div class="summary-num"><span id="remainNum">0</span><small>项待完成</small></div>
      </div>
      <div class="ring">
        <svg width="62" height="62" viewBox="0 0 62 62">
          <circle cx="31" cy="31" r="26" fill="none" stroke="rgba(255,255,255,.26)" stroke-width="7"/>
          <circle id="ringArc" cx="31" cy="31" r="26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
        </svg>
        <div class="ring-txt" id="ringTxt">0%</div>
      </div>
    </div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="summary-foot"><span id="doneText">已完成 0 项</span><span id="totalText">共 0 项</span></div>
  </section>

  <div class="composer">
    <input id="newTodo" class="input" type="text" maxlength="200" placeholder="今天要做什么？" autocomplete="off" aria-label="新增待办">
    <button id="addBtn" class="add" type="button" aria-label="添加待办" title="添加">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div id="inputHint" class="hint hidden">请先输入待办内容</div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab on" data-filter="all" type="button">全部</button>
      <button class="tab" data-filter="active" type="button">待完成</button>
      <button class="tab" data-filter="done" type="button">已完成</button>
    </div>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">已保存在本机</span></div>
  </div>

  <section class="list" id="list"></section>
  <div class="foot">静态版 · 数据保存在此浏览器，清除浏览器数据会丢失<br>正式版（账号登录 + 云端同步）：<a href="https://today-todo-24403.app.workbuddy.host/?sharecode=EJ2JVSND5V" target="_blank" rel="noopener">打开正式版</a></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var KEY = 'today-todo-gh-pages-v1';
  var FORMAL_URL = 'https://today-todo-24403.app.workbuddy.host/?sharecode=EJ2JVSND5V';
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    dateText: $('dateText'), remainNum: $('remainNum'), ringArc: $('ringArc'), ringTxt: $('ringTxt'),
    barFill: $('barFill'), doneText: $('doneText'), totalText: $('totalText'),
    newTodo: $('newTodo'), addBtn: $('addBtn'), inputHint: $('inputHint'), list: $('list'),
    syncDot: $('syncDot'), syncText: $('syncText'), toast: $('toast')
  };
  var state = { todos: [], filter: 'all', day: '', persistent: true, seq: 0 };
  var toastTimer = null;

  function todayStr() {
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var o = {};
    parts.forEach(function (p) { o[p.type] = p.value; });
    return o.year + '-' + o.month + '-' + o.day;
  }
  function dateLabel() {
    return new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai', month: 'long', day: 'numeric', weekday: 'long'
    }).format(new Date());
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.classList.remove('show'); }, 2600);
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      state.todos = Array.isArray(parsed) ? parsed.filter(function (t) {
        return t && typeof t.title === 'string' && typeof t.id === 'number';
      }) : [];
      state.seq = state.todos.reduce(function (m, t) { return Math.max(m, t.id); }, 0);
    } catch (e) {
      state.todos = []; state.persistent = false;
    }
    if (!state.persistent) {
      els.syncDot.className = 'dot bad';
      els.syncText.textContent = '仅本次会话有效';
      toast('浏览器禁止本地存储，数据只在当前页面有效');
    }
  }
  function save() {
    if (!state.persistent) return;
    try { localStorage.setItem(KEY, JSON.stringify(state.todos)); }
    catch (e) {
      state.persistent = false;
      els.syncDot.className = 'dot bad';
      els.syncText.textContent = '保存失败';
      toast('保存失败，请检查浏览器隐私设置');
    }
  }

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>';
  var EMPTY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>';

  function render() {
    var today = state.todos.filter(function (t) { return t.date === state.day; });
    var done = today.filter(function (t) { return t.done; }).length;
    var remain = today.length - done;
    var pct = today.length ? Math.round(done / today.length * 100) : 0;
    els.remainNum.textContent = remain;
    els.ringTxt.textContent = pct + '%';
    els.ringArc.setAttribute('stroke-dashoffset', String(163.36 * (1 - pct / 100)));
    els.barFill.style.width = pct + '%';
    els.doneText.textContent = '已完成 ' + done + ' 项';
    els.totalText.textContent = '共 ' + today.length + ' 项';

    var shown = today.filter(function (t) {
      if (state.filter === 'active') return !t.done;
      if (state.filter === 'done') return t.done;
      return true;
    });
    if (!shown.length) {
      var msg = today.length === 0
        ? ['今天还没有待办', '在上方输入框写下第一件事吧']
        : state.filter === 'active'
          ? ['今天的事都做完啦', '已完成 ' + done + ' 项，给自己点个赞']
          : ['还没有已完成的待办', '勾选完成后会出现在这里'];
      els.list.innerHTML = '<div class="empty"><div class="empty-ico">' + EMPTY_SVG + '</div><b>' + msg[0] + '</b><span>' + msg[1] + '</span></div>';
      return;
    }
    els.list.innerHTML = shown.map(function (t) {
      return '<div class="item' + (t.done ? ' done' : '') + '">' +
        '<button class="check' + (t.done ? ' on' : '') + '" type="button" data-act="check" data-id="' + t.id + '" aria-label="' + (t.done ? '标记为未完成' : '标记为完成') + '">' + CHECK_SVG + '</button>' +
        '<div class="txt">' + escapeHtml(t.title) + '</div>' +
        '<button class="del" type="button" data-act="del" data-id="' + t.id + '" aria-label="删除待办">' + TRASH_SVG + '</button>' +
      '</div>';
    }).join('');
  }

  function add() {
    var title = els.newTodo.value.trim();
    if (!title) {
      els.inputHint.classList.remove('hidden');
      els.newTodo.classList.remove('shake');
      void els.newTodo.offsetWidth;
      els.newTodo.classList.add('shake');
      els.newTodo.focus();
      return;
    }
    els.inputHint.classList.add('hidden');
    state.seq += 1;
    state.todos.push({ id: state.seq, title: title, done: false, date: state.day, createdAt: Date.now() });
    els.newTodo.value = '';
    save(); render();
  }
  function act(id, kind) {
    var i = state.todos.findIndex(function (t) { return t.id === id; });
    if (i < 0) return;
    if (kind === 'check') state.todos[i].done = !state.todos[i].done;
    else state.todos.splice(i, 1);
    save(); render();
  }

  els.addBtn.addEventListener('click', add);
  els.newTodo.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
  els.newTodo.addEventListener('input', function () { els.inputHint.classList.add('hidden'); });
  els.list.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    act(Number(btn.dataset.id), btn.dataset.act);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.addEventListener('click', function () {
      state.filter = tab.dataset.filter;
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('on', t === tab); });
      render();
    });
  });

  state.day = todayStr();
  els.dateText.textContent = dateLabel() + ' · 仅今天';
  load(); render();
  setInterval(function () {
    var d = todayStr();
    if (d !== state.day) {
      state.day = d;
      els.dateText.textContent = dateLabel() + ' · 仅今天';
      render();
    }
  }, 60000);
})();
</script>
</body>
</html>
